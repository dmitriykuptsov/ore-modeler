services:
  mysql:
    image: mysql:8.4
    container_name: ore-modeler-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ore_modeler
      MYSQL_USER: ore_modeler
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ore-modeler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: ore-modeler-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://ore_modeler:password@mysql:3306/ore_modeler
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      - mysql
      - redis

  worker:
    build: ./backend
    container_name: ore-modeler-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: mysql+pymysql://ore_modeler:password@mysql:3306/ore_modeler
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage
    depends_on:
      - mysql
      - redis

  frontend:
    image: node:22-alpine
    container_name: ore-modeler-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:

  
